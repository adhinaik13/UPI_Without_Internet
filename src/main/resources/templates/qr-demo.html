<!DOCTYPE html>
<html>
<head>
    <title>UPI Offline - QR Payment</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; background: #1a1a2e; color: white; }
        h1 { color: #e94560; }
        .form-group { margin: 15px 0; }
        label { display: inline-block; width: 120px; font-weight: bold; }
        input { padding: 8px; width: 250px; border-radius: 4px; border: 1px solid #533483; }
        button { background: #e94560; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #ff6b6b; }
        #qrResult { margin-top: 30px; text-align: center; }
        #qrImage { max-width: 300px; border: 3px solid #e94560; border-radius: 8px; margin: 20px auto; display: none; }
        .info { background: #0f3460; padding: 15px; border-radius: 8px; margin: 10px 0; }
        .success { color: #00d9ff; }
    </style>
</head>
<body>
    <h1>🔐 UPI Offline Payment - QR Generator</h1>
    <p class="info">This simulates a sender's phone generating an offline payment QR code.</p>
    
    <div class="form-group">
        <label>Sender VPA:</label>
        <input type="text" id="sender" value="alice@upi">
    </div>
    <div class="form-group">
        <label>Receiver VPA:</label>
        <input type="text" id="receiver" value="bob@upi">
    </div>
    <div class="form-group">
        <label>Amount (₹):</label>
        <input type="number" id="amount" value="100">
    </div>
    <div class="form-group">
        <label>PIN:</label>
        <input type="password" id="pin" value="1234">
    </div>
    
    <button onclick="generateQR()">Generate QR Code</button>
    
    <div id="qrResult">
        <img id="qrImage" src="" alt="QR Code">
        <p id="packetInfo"></p>
    </div>

    <script>
        async function generateQR() {
            const sender = document.getElementById('sender').value;
            const receiver = document.getElementById('receiver').value;
            const amount = document.getElementById('amount').value;
            const pin = document.getElementById('pin').value;
            
            const url = `/api/demo/qr?senderVpa=${encodeURIComponent(sender)}&receiverVpa=${encodeURIComponent(receiver)}&amount=${amount}&pin=${pin}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                document.getElementById('qrImage').src = data.qrCodeBase64;
                document.getElementById('qrImage').style.display = 'block';
                document.getElementById('packetInfo').innerHTML = 
                    `<span class="success">✅ Packet ID:</span> ${data.packetId}<br>` +
                    `<span class="success">✅ TTL:</span> ${data.ttl} hops<br>` +
                    `<span class="success">✅ Encrypted Size:</span> ${data.ciphertextLength} bytes`;
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
